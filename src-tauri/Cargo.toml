[package]
name = "termdeck"
version = "0.1.1"
description = "Portable multi-session terminal for AI coding CLIs"
license = "MIT"
repository = "https://github.com/aivrar/TermDeck"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
arboard = "3"
png = "0.17"
base64 = "0.22"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[profile.dev]
opt-level = 1

[profile.release]
strip = true
